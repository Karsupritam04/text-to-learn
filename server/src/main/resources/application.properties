spring.application.name=text-to-learn-backend
server.port=${PORT:${SERVER_PORT:10000}}
server.address=0.0.0.0

# ---- MongoDB ----
# Set default database name. When MONGO_URI env var is set, spring.data.mongodb.uri overrides this.
spring.data.mongodb.database=text_to_learn

# ---- Auth0 (Milestone 4) ----
# Leave AUTH0_ISSUER empty to run the API with security disabled (dev mode, see SecurityConfig)
auth0.issuer=${AUTH0_ISSUER:}
auth0.audience=${AUTH0_AUDIENCE:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:}

# ---- AI provider (Milestone 8) ----
# provider = "rule-based" (no key needed, works out of the box) or "openai"
ai.provider=${AI_PROVIDER:rule-based}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ---- YouTube Data API (Milestone 9) ----
youtube.api-key=${YOUTUBE_API_KEY:}

# ---- Gemini (Milestone 10 - Hinglish TTS) ----
gemini.api-key=${GEMINI_API_KEY:}

# ---- CORS ----
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Misc ----
spring.jackson.default-property-inclusion=non_null
logging.level.com.texttolearn=INFO
