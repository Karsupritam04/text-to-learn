services:
  # Spring Boot Fullstack Service (Backend API + React Frontend)
  - type: web
    name: text-to-learn
    env: docker
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: AI_PROVIDER
        value: rule-based
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '*'
